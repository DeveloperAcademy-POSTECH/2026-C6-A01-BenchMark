name: Android
on:
  push:
    branches: [develop]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate converted AR assets
        run: python3 tools/check_ar_models.py
      - name: Build, navigation tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lofi-verification
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/
            apps/android/app/build/lofi-screenshots/
