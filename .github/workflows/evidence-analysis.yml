name: Evidence analysis
on:
  push:
    branches: [develop]
    paths: ['supabase/functions/analyze-evidence/**', 'supabase/tests/evidence-analysis*.mjs', 'supabase/package.json', '.github/workflows/evidence-analysis.yml']
  pull_request:
    paths: ['supabase/functions/analyze-evidence/**', 'supabase/tests/evidence-analysis*.mjs', 'supabase/package.json', '.github/workflows/evidence-analysis.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm --prefix supabase test
      - run: npm --prefix supabase run check
